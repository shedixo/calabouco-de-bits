  if(o.k==="x"){const s=RH/dd*.6,up=o.e.to<flr;if(up){for(let i=0;i<5;i++){ctx.fillStyle=["#6a5f55","#857a6e","#a09484","#bcb09c","#d8cdb8"][i];ctx.fillRect(c-s*.4*(1-i*.12),fl-(i+1)*s*.16,s*.8*(1-i*.12),s*.16)}}else{ctx.fillStyle="#050507";ctx.fillRect(c-s*.4,fl-s*.3,s*.8,s*.3);for(let i=0;i<4;i++){ctx.fillStyle=["#3a322c","#2a2420","#1c1814","#100d0a"][i];ctx.fillRect(c-s*.4+i*s*.08,fl-s*.3+i*s*.06,s*.8-i*s*.16,s*.05)}}const px=c+s*.55;ctx.fillStyle="#3a2a1c";ctx.fillRect(px-s*.03,fl-s*.7,s*.06,s*.7);ctx.fillStyle="#6a4a2a";ctx.fillRect(px-s*.2,fl-s*.75,s*.4,s*.3);ctx.fillStyle="#8a6a3a";ctx.fillRect(px-s*.18,fl-s*.73,s*.36,s*.26);ctx.fillStyle="#1a1008";ctx.font="bold "+Math.max(5,s*.3)+"px monospace";ctx.fillText(o.e.to,px-s*.07,fl-s*.5)}else if(o.k==="c"){const s=RH/dd*.4;ctx.fillStyle=o.o?"#3a2a1c":"#7a4a22";ctx.fillRect(c-s*.5,fl-s*.7,s,s*.7);ctx.fillStyle="#f2c94c";ctx.fillRect(c-s*.5,fl-s*.45,s,s*.1);if(!o.o)ctx.fillRect(c-s*.08,fl-s*.5,s*.16,s*.2)}else if(o.k==="n"){const s=RH/dd*.75;ctx.fillStyle="#3a2a4a";ctx.fillRect(c-s*.25,fl-s*.8,s*.5,s*.8);ctx.fillStyle="#5a4a6a";ctx.fillRect(c-s*.18,fl-s*.95,s*.36,s*.2);ctx.fillStyle="#f2c94c";ctx.fillRect(c-s*.1,fl-s*.82,s*.08,s*.06);ctx.fillRect(c+s*.02,fl-s*.82,s*.08,s*.06);ctx.fillStyle="#8a5a2b";ctx.fillRect(c+s*.2,fl-s*.5,s*.22,s*.3)}
  else{const e=o.e,s=Math.min(RH,RH/dd*.7)*(e.z||1),w=s*.55,x=c-w/2+(e===en?(Math.random()-.5)*shake:0),y=fl-s*.85;
   drawMon(e,x,y,s,w,T);ctx.save();ctx.globalAlpha=0;
   if(e.n==="Demônio"){ctx.fillRect(x,y-s*.12,w*.2,s*.12);ctx.fillRect(x+w*.8,y-s*.12,w*.2,s*.12)}
   ctx.fillStyle="#050507";ctx.fillRect(x+w*.2,y+s*.15,w*.2,s*.1);ctx.fillRect(x+w*.6,y+s*.15,w*.2,s*.1);

 });

 const bob=Math.sin(T*.004)*1.5,y=RH-46+bob-fx.a*14-fx.m*10;

 if(fx.m>0){const r=6+fx.m*10,cx=RW/2,cy=y-2;ctx.globalAlpha=.35;ctx.fillStyle=LIN.c;ctx.fillRect(cx-r*1.5,cy-r*1.5,r*3,r*3);ctx.globalAlpha=1;

function explore(k){
 if(k===3)P.ta-=Math.PI/2;else if(k===1)P.ta+=Math.PI/2;else if(k===2)P.ta+=Math.PI;
 else{
  const nx=P.tx+Math.round(Math.cos(P.ta)),ny=P.ty+Math.round(Math.sin(P.ta));
  const e=ENT.find(e=>!e.dead&&(e.x|0)===(nx|0)&&(e.y|0)===(ny|0));
  if(e)return startCombat(e);
  if(NPC&&(NPC.x|0)===(nx|0)&&(NPC.y|0)===(ny|0))return showShop();
  const x1=EX.find(q=>(q.x|0)===(nx|0)&&(q.y|0)===(ny|0));
  if(x1){P.tx=nx;P.ty=ny;mode="trans";return setTimeout(()=>{mode="explore";go(x1.to,flr)},250)}
  const ch=CH.find(c=>!c.o&&(c.x|0)===(nx|0)&&(c.y|0)===(ny|0));
  if(ch){ch.o=1;const c=ch.rich?30+rnd(31):5+rnd(16);coins+=c;let m=`Baú! +${c} moedas.`;if((ch.rich||Math.random()<.25)&&bag.length<12){const id=ch.rich?9+rnd(4):dropId(Math.random()<.3);bag.push(id);m+=` Achou ${IT[id].n}!`}return log(m)}
  if(!solid(nx,ny)){P.tx=nx;P.ty=ny;mark();monsterStep()}
 }
}
function startCombat(e){e.mx=e.mx||e.hp;en=e;mode="combat";log(`${e.n} apareceu! Escolha a ação.`);menu()}
function menu(){mode="combat";$("q").style.display="none";$("m").style.display="flex";
 $("m").innerHTML=`<button data-a="atk">ATACAR<small>gasta energia</small></button><button data-a="mag">✦ ${SPELL.n}<small>gasta ${SPELL.cost} mana</small></button><button data-a="fug">FUGIR</button>`;hud()}
$("m").onclick=e=>{const a=e.target.dataset.a;if(a)act(a)};

function qteOld(keys,cb,dodge,grp,spd){
 const p=en?[0,.25,.45][en.t]:0,seq=keys.map(k=>({k,inv:Math.random()<p}));
 if(!dodge&&Math.random()<.05+E("luk")*.05)seq.push({k:Math.random()*4|0,star:1});
 let i=0,hits=0,star=false;mode="qte";$("m").style.display="none";$("q").style.display="block";
 function next(){
  if(i>=seq.length){cur=null;$("q").style.display="none";return cb({hits,len:keys.length,star})}
  const a=seq[i],tired=!dodge&&!a.star&&ene<=0;
  if(!dodge&&!a.star&&ene>0)ene--;hud();
  $("arrow").style.transform=`rotate(${a.k*90}deg)`;
  const col=a.star?"#f2c94c":a.inv?"#b46cff":tired?"#e04040":"#ffffff";
  $("arrow").style.color=col;$("q").style.borderColor=col;
  $("dots").textContent=keys.map((_,j)=>(j<i?"●":"○")+(grp&&(j+1)%grp===0?"  ":"")).join("")+(a.star?" ★":"");
  const t=(950+E("agi")*130)*(spd||1)*(tired?.55:1)*(a.star?.8:1)*(a.inv?1.15:1),b=$("tb");
  b.style.transition="none";b.style.width="100%";void b.offsetWidth;b.style.transition=`width ${t}ms linear`;b.style.width="0";
  cur={lock:0,tm:setTimeout(()=>ans(-1),t),ans};
 }
 function ans(k){
  if(cur.lock)return;cur.lock=1;clearTimeout(cur.tm);const a=seq[i],need=a.inv?(a.k+2)%4:a.k;
  if(k===need){a.star?star=true:hits++;$("arrow").style.color="#5bd68a"}else $("arrow").style.color="#555";
  i++;setTimeout(next,180);
 }
 next();
}
function qte(rows,cb,dodge,spd,far){
 const p=en?en.inv:0,all=rows.flat(),starOn=!dodge&&Math.random()<.05+E("luk")*.05;
 let ri=0,hits=0,star=false,ai=0,seq=[];
 mode="qte";$("m").style.display="none";$("q").style.display="block";
 function draw(){
  $("dots").textContent=rows.length>1?(ri+1)+"/"+rows.length:"";
  $("ar").innerHTML=seq.map((a,j)=>{if(j<ai)return `<b style="color:${a.ok?"#5bd68a":"#e04040"}">${a.ok?"✓":"✗"}</b>`;if(a.hid&&j>ai)return '<b style="color:#8a8a9a">?</b>';const col=a.star?"#f2c94c":a.inv?"#b46cff":a.tired?"#e04040":"#fff";
   return `<svg viewBox="0 0 100 100" style="color:${col};transform:rotate(${a.k*90}deg) scale(${j===ai?1.2:1});opacity:${j<ai?.55:1}"><polygon points="50,6 94,52 68,52 68,94 32,94 32,52 6,52" fill="currentColor" stroke="#000" stroke-width="5" stroke-linejoin="round"/></svg>`}).join("")}
 function row(){
  if(ri>=rows.length){cur=null;$("q").style.display="none";if(!dodge)ene=Math.min(maxen,ene+Math.ceil(maxen/2));return cb({hits,len:all.length,star})}
  seq=rows[ri].map(k=>({k,inv:Math.random()<p}));
  if(far&&seq.length>=3){let h=0;seq.forEach((a,j)=>{if(j>0&&Math.random()<.5){a.hid=1;h++}});if(!h)seq[seq.length-1].hid=1}
  if(starOn&&ri===rows.length-1)seq.push({k:rnd(4),star:1});
  ai=0;let T=0;
  let e0=ene;seq.forEach(a=>{a.cs=(a.star||a.inv)?2:1;a.tired=e0<=0;e0=Math.max(0,e0-a.cs);T+=(950+E("agi")*130)*(spd||1)*(a.tired?.5:1)*(a.star?.8:1)*(a.inv?1.15:1)*.8});
  hud();draw();const b=$("tb");
  b.style.transition="none";b.style.width="100%";void b.offsetWidth;b.style.transition=`width ${T}ms linear`;b.style.width="0";
  cur={lock:0,tm:setTimeout(()=>{cur.lock=1;for(let j=ai;j<seq.length;j++)ene=Math.max(0,ene-seq[j].cs);hud();ri++;setTimeout(row,200)},T),ans};
 }
 function ans(k){
  if(cur.lock)return;const a=seq[ai],need=a.inv?(a.k+2)%4:a.k;
  a.ok=k===need;if(a.ok){a.star?star=true:hits++}ene=Math.max(0,ene-a.cs);hud();
  ai++;draw();
  if(ai>=seq.length){cur.lock=1;clearTimeout(cur.tm);ri++;setTimeout(row,250)}
 }
 row();
}
function press(k){if(mode==="qte"&&cur)cur.ans(k);else if(mode==="explore")explore(k)}
function act(t){
 if(mode!=="combat")return;
 if(t==="atk"){fx.a=1;qte([rk(4)],r=>{let d=Math.round(E("str")*1.5+r.hits*2);if(r.star)d*=2;if(r.hits)d=Math.max(1,d-en.df);else d=0;hit(d,r.star?"CRÍTICO! ":"")},false,Math.max(.6,1-.06*en.ag))}
 else if(t==="mag"){
  if(mp<SPELL.cost){log("Sem mana!");return}
  mp-=SPELL.cost;fx.m=1;qte(SPELL.pat,r=>{fx.m=1;hit(r.hits*SPELL.dm*(r.star?2:1),r.star?"CRÍTICO! ":SPELL.n+"! ")},false,Math.max(.6,1-.06*en.ag));
 }else qte([rk(3)],r=>{
  if(r.hits>=2){log("Você fugiu!");en=null;mode="explore";$("m").style.display="none"}
  else{log("Não conseguiu fugir!");setTimeout(enemyTurn,800)}
 });
}
function hit(d,pre){
 en.hp-=d;shake=6;log(pre+(d?`Causou ${d} de dano.`:"Errou tudo!"));
 if(en.hp<=0){const e=en;e.dead=true;en=null;ess+=e.ex;let m=`${e.n} derrotado! +${e.ex} essência.`;if(Math.random()<.35){const c=1+rnd(3);coins+=c;m+=` +${c} moedas.`}
  if(Math.random()<(e.rk||e.el?.14:.05)&&bag.length<12){const id=dropId(e.rk||e.el);bag.push(id);m+=` Dropou ${IT[id].n}!`}
  setTimeout(()=>{log(m);if(ess>=need){ess-=need;need=Math.round(need*2.3);levelUp()}else{mode="explore";$("m").style.display="none"}},900)}
 else setTimeout(enemyTurn,900);
}
function enemyTurn(){
 const far=Math.random()<(en.rk?.35:.1);log(`${en.n} ataca${far?" de longe":""}! ESQUIVE!`);
 setTimeout(()=>qte(atkSeq(en),r=>{
  const ar=["helm","chest","glove","legs"].filter(s=>eq[s]!=null).length,pw=Math.min(.9,Math.max(.2,.35+.08*(E("str")+E("agi")-en.fo-en.ag)+ar*.05));let d=Math.max(1,Math.round(en.atk*(1-r.hits/r.len*pw)-E("str")*.5-ar*.5));
  hp-=d;if(d)shake=6;hud();
  if(hp<=0)return end("VOCÊ CAIU...","Tente outra linhagem.");
  log(`Defesa ${Math.round(r.hits/r.len*pw*100)}%: levou ${d} de dano.`);
  setTimeout(()=>{menu()},900);
 },true,1-.1*en.ag,far),700);
}

function showMenu(){$("ov").style.display="block";

 eq.ring.forEach((id,i)=>h+=`<button class="sl ${id!=null?"on":""}" data-u="r${i}"><img src="${I.ring}"></button>`);

 for(let i=0;i<12;i++){const id=bag[i];h+=id!=null?`<button class="ic" data-e="${i}">${IT[id].s==="ring"?`<img src="${I.ring}" style="width:22px">`:""}${IT[id].n.split(" ")[0]}<small>${Object.entries(IT[id].b).map(([k,v])=>NM[k][0].slice(0,3)+"+"+v)}</small></button>`:`<button class="ic" disabled></button>`}

$("bagb").onclick=()=>{if(mode==="explore")showBag()};
$("ovc").onclick=e=>{
 const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(t.id==="st"){mode="stats";showStats()}
 else if(t.id==="hw")$("ht").innerHTML='<p>↑ anda · ← → viram · ↓ meia-volta. Ande até um monstro pra lutar.<br>Ações viram setas: acerte no tempo. <span style="color:#b46cff">Seta ROXA = clique o contrário.</span> Seta dourada = crítico. Cada seta gasta 1 de energia (★ e roxas gastam 2). Sem energia, a seta dura só 50% do tempo. A energia volta um pouco no fim do seu turno. Quando o monstro ataca, esquive com as setas. Monstros dão essência; junte pra subir de nível. Cada escada leva a um andar (o número está nela; clara = sobe, escura = desce). Comece no andar 9 e chegue ao 0! Baús e drops são raros.</p>';

  recalc();if(!started){started=true;hp=maxhp;mp=maxmp;ene=maxen;log("Andar 9. Suba até o andar 0 pelas escadas.")}
  else{hp=Math.min(maxhp,hp+6);ene=maxen;log("Você evoluiu. Siga em frente.")}

 else if(d.e!==undefined){const i=+d.e,id=bag[i],it=IT[id];

  if(it.s==="ring"){const r=eq.ring.indexOf(null);if(r<0){bmsg="Anéis cheios!";return showBag()}eq.ring[r]=id;bag.splice(i,1)}
  else{bag.splice(i,1);if(eq[it.s]!=null)bag.push(eq[it.s]);eq[it.s]=id}
  bmsg=it.n+" equipado";recalc();showBag()}
 else if(d.br){const k=d.br;if(k==="d")SPELL.dm++;else if(k==="e"){SPELL.pat.push(rk(3));SPELL.dm++;SPELL.cost++;SPELL.tier++}else{const v=EVO[LIN.n];LIN.n=v[0];LIN.c=v[1];LIN.s=v[0];SPELL.dm++}SPELL.n=LIN.s+(SPELL.tier>1?" "+"I".repeat(SPELL.tier):"");if(pts){mode="stats";showStats()}else resume()}
 else if(d.by!==undefined){const i=+d.by,s=NPC.st[i];if(!s)return;if(coins<s.pr)smsg="Moedas insuficientes!";else if(bag.length>=12)smsg="Bolsa cheia!";else{coins-=s.pr;bag.push(s.id);NPC.st.splice(i,1);smsg="Comprou "+IT[s.id].n+"!"}showShop()}
